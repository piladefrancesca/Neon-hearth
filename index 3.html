<script>
'use strict';
const $=id=>document.getElementById(id),cv=$('game'),ctx=cv.getContext('2d'),overlay=$('overlay'),card=$('card');
const W=1280,H=880,TAU=Math.PI*2;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let vw=0,vh=0,dpr=1,t=0,last=0,mode='menu',stage=0,hearts=3,invuln=0,dashTime=0,dashCool=0,assist=false,sound=false,audio=null,checkpoint=0;
let player={x:100,y:720,dx:0,dy:-1},blocks=[],items=[],drones=[],goal={x:1140,y:140},particles=[],camera={x:0,y:0},keys={},joy={x:0,y:0},stickId=null,previousMode='world',modalAction=null;
let ride={time:0,x:0,lane:1,events:[],emails:0,spawn:0,dist:0},toastTimer=null,canInteract=false;
try{checkpoint=Math.max(0,Math.min(4,Number(localStorage.getItem('andrea-exe-v4-checkpoint'))||0))}catch{}
function save(n){checkpoint=n;try{localStorage.setItem('andrea-exe-v4-checkpoint',String(n))}catch{}}
function resize(){const r=$('app').getBoundingClientRect();vw=r.width;vh=r.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function clearInput(){keys={};joy={x:0,y:0};stickId=null;$('knob').style.transform=''}
function beep(freq=520,duration=.11,type='sine',vol=.05){if(!sound)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function chime(){[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*90))}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2500)}
function showModal(eyebrow,title,body,buttons,extra=''){clearInput();mode='modal';overlay.hidden=false;overlay.className='overlay';$('cover').hidden=true;card.innerHTML='<div class="eyebrow">'+eyebrow+'</div><h2 id="modal-title">'+title+'</h2><div class="bodycopy">'+body+'</div>'+extra+'<div class="buttons"></div>';const box=card.querySelector('.buttons');buttons.forEach(([label,fn,plain])=>{const b=document.createElement('button');b.className=plain?'plain':'primary';b.textContent=label;b.onclick=()=>{beep(680);fn()};box.appendChild(b)});requestAnimationFrame(()=>box.querySelector('button')?.focus())}

let soundMix={music:.45,effects:.65};

// Self-contained cyberpunk synth. Starts/resumes only from a user gesture.
const Synth=(()=>{
 let context=null,master=null,music=null,fx=null,limiter=null,noise=null,engine=null,ready=false,failed=false,sceneKey='',nextStep=0,step=0,beatTime=null,footDistance=0,stepTime=0,alertTime=0;

 function ensure(){if(failed)return false;try{if(!context){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){failed=true;return false}context=new AC();audio=context;master=context.createGain();master.gain.value=sound?.55:0;limiter=context.createDynamicsCompressor();limiter.threshold.value=-15;limiter.knee.value=18;limiter.ratio.value=6;limiter.attack.value=.006;limiter.release.value=.18;music=context.createGain();music.gain.value=soundMix.music*.5;fx=context.createGain();fx.gain.value=soundMix.effects*.9;music.connect(master);fx.connect(master);master.connect(limiter);limiter.connect(context.destination);noise=context.createBuffer(1,Math.floor(context.sampleRate*.4),context.sampleRate);const data=noise.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);ready=true}

 function toggle(value){sound=!!value;try{localStorage.setItem('andrea-exe-audio',sound?'on':'off')}catch{}if(sound){ensure();setGain(master,.55);nextStep=context?context.currentTime:0}else{setGain(master,0,.02);stopMusic()}ui()}
 function voice(freq,duration=.12,type='triangle',volume=.05,when=null,bus='fx',endFrequency=null){if(!sound||!context||!ready||context.state!=='running'||document.hidden||voices.size>72)return;freq=Number(freq);duration=Number(duration);volume=Number(volume);if(!Number.isFinite(freq)||!Number.isFinite(duration)||!Number.isFinite(volume)||freq<=0||duration<=0||volume<=0)return;const start=Math.max(context.currentTime,when??context.currentTime),end=start+Math.min(duration,3.5);const o=context.createOscillator(),g=context.createGain(),filter=context.createBiquadFilter();o.type=['sine','square','sawtooth','triangle'].includes(type)?type:'triangle';o.frequency.setValueAtTime(Math.min(12000,freq),start);if(endFrequency&&Number.isFinite(endFrequency))o.frequency.exponentialRampToValueAtTime(Math.max(20,endFrequency),end);filter.type='lowpass';filter.frequency.value=type==='sawtooth'?1300:4200;g.gain.setValueAtTime(.0001,start);g.gain.linearRampToValueAtTime(Math.min(volume,.2),Math.min(end-.001,start+.012));g.gain.exponentialRampToValueAtTime(.0001,end);o.connect(filter);filter.connect(g);g.connect(bus==='music'?music:fx);const v={source:o,bus};voices.add(v);o.onended=()=>{voices.delete(v);o.disconnect();g.disconnect();filter.disconnect()};o.start(start);o.stop(end+.02)}
 function hiss(duration=.08,volume=.04,filterFrequency=2400,when=null){if(!sound||!context||context.state!=='running'||document.hidden||voices.size>72)return;const start=Math.max(context.currentTime,when??context.currentTime),o=context.createBufferSource(),g=context.createGain(),f=context.createBiquadFilter();o.buffer=noise;f.type='highpass';f.frequency.value=filterFrequency;g.gain.setValueAtTime(Math.max(.0001,volume),start);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(f);f.connect(g);g.connect(music);const v={source:o,bus:'music'};voices.add(v);o.onended=()=>{voices.delete(v);o.disconnect();f.disconnect();g.disconnect()};o.start(start);o.stop(start+duration+.02)}
 function effect(kind){if(!sound||!ensure())return;const now=context.currentTime;if(kind==='dash'){voice(170,.22,'sawtooth',.05,null,'fx',720);voice(650,.16,'triangle',.035,null,'fx',180)}else if(kind==='damage'){voice(130,.3,'sawtooth',.065,null,'fx',38);voice(54,.24,'triangle',.018)}else if(kind==='shield'){[440,660,880].forEach((f,i)=>voice(f,.24,'sine',.045,now+i*.045))}else if(kind==='portal'){[164.81,246.94,329.63,493.88,659.25].forEach((f,i)=>voice(f,.6,'triangle',.04,now+i*.07))}else if(kind==='collect'){[523.25,659.25,783.99].forEach((f,i)=>voice(f,.22,'triangle',.045,now+i*.07))}else if(kind==='brake'){voice(280,.32,'sawtooth',.035,null,'fx',65)}else voice(620,.06,'triangle',.035)}
 function motor(){if(engine||!context)return;const gain=context.createGain();gain.gain.value=.03;gain.connect(music);const filter=context.createBiquadFilter();filter.type='lowpass';filter.frequency.value=390;filter.connect(gain);const a=context.createOscillator(),b=context.createOscillator();a.type='sawtooth';b.type='triangle';a.frequency.value=56;b.frequency.value=28;a.connect(filter);b.connect(filter);a.start();b.start();a.onended=()=>{a.disconnect();filter.disconnect()};b.onended=()=>b.disconnect();engine={oscillators:[a,b],gain}}

 const bpm=stage===1?82:stage===2?(campaign.route==='city'?128:112):stage===3?88:104,interval=60/bpm/4,roots=[82.4069,73.4162,82.4069,65.4064],root=roots[stage]||82.4069;

 if(engine){const braking=keys[' ']||keys.brake||joy.y>.5,f=(braking?42:68)+Math.min(20,ride.dist/50);engine.oscillators[0].frequency.setTargetAtTime(f,context.currentTime,.12);engine.oscillators[1].frequency.setTargetAtTime(f/2,context.currentTime,.12)}
 if(mode==='world'&&beatTime)footDistance+=Math.hypot(player.x-beatTime.x,player.y-beatTime.y);if(mode==='world'&&footDistance>48&&t-stepTime>.18){voice(stage===1?170:95,.035,'triangle',.018);stepTime=t;footDistance=0}beatTime={x:player.x,y:player.y};
 if(mode==='world'&&drones.some(d=>d.alert)&&t-alertTime>.9){voice(650,.08,'triangle',.01);alertTime=t}
 }
